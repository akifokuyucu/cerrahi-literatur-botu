name = "cerrahi-literatur-botu"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Panelden girilen ayarlar her güncellemede silinmesin
keep_vars = true

[vars]
VERI_URL = "https://raw.githubusercontent.com/akifokuyucu/cerrahi-literatur-botu/main/cikti/hafta.json"
# Notion veritabanları (kimlikler gizli değil; erişim NOTION_TOKEN ile)
NOTION_ARSIV_DB = "50942cc7e2dc422c90de38a3dd7975b4"
NOTION_ICERIK_DB = "820f0899d21244b294298ece8fc87389"

# Gizli değerler (TELEGRAM_TOKEN, GEMINI_API_KEY, WEBHOOK_SECRET,
# IZINLI_KULLANICI, NOTION_TOKEN) buraya YAZILMAZ; Cloudflare panelinden "Secret" olarak girilir.

# KV önbelleği: ayrıntılı özetler 120 gün saklanır, tekrar istenince anında gelir
[[kv_namespaces]]
binding = "ONBELLEK"
id = "39f59024e88a4c3a92666c0ef65adb7e"

# Hata ayıklama için Worker günlükleri (panelde "Observability" sekmesi)
[observability]
enabled = true
