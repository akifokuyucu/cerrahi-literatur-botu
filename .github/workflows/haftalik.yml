name: Haftalık hazırlık

on:
  schedule:
    - cron: "0 4 * * 1"   # Her pazartesi 04:00 UTC = 07:00 Türkiye
    - cron: "0 7 * * 1"   # 10:00 yedek: sabahki çalışma olmadıysa ya da başarısız olduysa
  workflow_dispatch:       # "Run workflow" tuşuyla elle çalıştırma

permissions:
  contents: write

concurrency:
  group: haftalik
  cancel-in-progress: false

jobs:
  hazirla:
    runs-on: ubuntu-24.04   # ubuntu-latest 19 Ekim 2026'da Ubuntu 26'ya geçiyor; sabit tutuldu
    timeout-minutes: 60   # ~20 dk ayrıntılı özetler dahil
    steps:
      - uses: actions/checkout@v7

      # 10:00'daki yedek çalışma, sabah liste zaten hazırlandıysa hiçbir şey yapmaz
      - name: Bugün zaten hazırlandı mı?
        id: kontrol
        if: github.event_name == 'schedule'
        run: |
          if [ "$(jq -r .hazirlanma cikti/hafta.json 2>/dev/null)" = "$(date +%F)" ]; then
            echo "Bugünün dosyası zaten var, atlanıyor."
            echo "atla=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.kontrol.outputs.atla != 'true'
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        if: steps.kontrol.outputs.atla != 'true'
        run: pip install -r motor/requirements.txt

      - name: 14 alanı tara, puanla, özetle (kısa ve ayrıntılı)
        if: steps.kontrol.outputs.atla != 'true'
        working-directory: motor
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Yedek sağlayıcılar (motor/llm.py); anahtarı olmayan atlanır
          LLM_ZINCIRI: ${{ vars.LLM_ZINCIRI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          BOT_ANAHTAR: ${{ secrets.BOT_ANAHTAR }}
        run: python hazirla.py

      - name: Sonuçları depoya kaydet
        if: steps.kontrol.outputs.atla != 'true'
        run: |
          git config user.name "haftalik-hazirlik"
          git config user.email "actions@users.noreply.github.com"
          git add cikti/
          git diff --cached --quiet && exit 0
          git commit -m "Haftalık liste: $(date +%F)"
          # Çalışma sürerken depoya başka değişiklik geldiyse üstüne ekle
          git pull --rebase origin main
          git push
